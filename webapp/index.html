<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Printer Control</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header id="header">
    <div class="header-left">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="8" width="20" height="2" rx="1" fill="currentColor" opacity="0.5"/>
        <rect x="4" y="12" width="20" height="2" rx="1" fill="currentColor" opacity="0.6"/>
        <rect x="4" y="16" width="20" height="2" rx="1" fill="currentColor" opacity="0.7"/>
        <rect x="6" y="20" width="16" height="4" rx="1" fill="currentColor" opacity="0.3"/>
        <rect x="10" y="4" width="8" height="4" rx="1" fill="var(--accent)"/>
      </svg>
      <h1>Printer Control</h1>
    </div>
    <div class="header-right">
      <span id="connection-dot" class="dot offline" title="Disconnected"></span>
    </div>
  </header>

  <!-- ── Navigation Tabs ─────────────────────────────────────────────── -->
  <nav id="tabs">
    <button class="tab active" data-tab="dashboard">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M3 3h6v8H3V3zm0 10h6v4H3v-4zm8-10h6v4h-6V3zm0 6h6v8h-6V9z"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="tab" data-tab="control">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm-1 4h2v5h-2V6zm0 6h2v2h-2v-2z"/></svg>
      <span>Control</span>
    </button>
    <button class="tab" data-tab="files">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M2 4a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V4z"/></svg>
      <span>Files</span>
    </button>
    <button class="tab" data-tab="camera">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M4 5a2 2 0 00-2 2v6a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586l-1-1H6.586l-1 1H4zm6 2a3 3 0 110 6 3 3 0 010-6z"/></svg>
      <span>Camera</span>
    </button>
  </nav>

  <!-- ── Dashboard Tab ───────────────────────────────────────────────── -->
  <main id="tab-dashboard" class="tab-content active">
    <!-- State Card -->
    <div class="card state-card">
      <div class="card-row">
        <div class="state-info">
          <span id="state-icon" class="state-dot ready"></span>
          <span id="state-text" class="state-label">Connecting...</span>
        </div>
        <span id="state-file" class="state-file">—</span>
      </div>
    </div>

    <!-- Progress Card -->
    <div class="card" id="progress-card">
      <div class="card-header">Print Progress</div>
      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
      <div class="progress-stats">
        <div class="stat">
          <span class="stat-label">Duration</span>
          <span class="stat-value" id="stat-duration">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">ETA</span>
          <span class="stat-value" id="stat-eta">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Filament</span>
          <span class="stat-value" id="stat-filament">—</span>
        </div>
      </div>
    </div>

    <!-- Temperature Cards -->
    <div class="temp-grid">
      <div class="card temp-card">
        <div class="temp-header">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="var(--orange)"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="3" fill="currentColor"/></svg>
          <span>Hotend</span>
        </div>
        <div class="temp-value">
          <span id="temp-hotend" class="temp-current">0</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="temp-target">
          Target: <span id="target-hotend">0</span>°C
        </div>
        <div class="temp-power-bar">
          <div class="power-fill" id="power-hotend" style="width: 0%"></div>
        </div>
      </div>

      <div class="card temp-card">
        <div class="temp-header">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="var(--blue)"><rect x="2" y="10" width="14" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="13" width="8" height="1.5" rx="0.5" fill="currentColor"/></svg>
          <span>Bed</span>
        </div>
        <div class="temp-value">
          <span id="temp-bed" class="temp-current">0</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="temp-target">
          Target: <span id="target-bed">0</span>°C
        </div>
        <div class="temp-power-bar">
          <div class="power-fill bed" id="power-bed" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Control Tab ─────────────────────────────────────────────────── -->
  <main id="tab-control" class="tab-content">
    <!-- Print Control -->
    <div class="card">
      <div class="card-header">Print Control</div>
      <div class="button-grid">
        <button class="btn" onclick="sendCmd('pause')" id="btn-pause">⏸ Pause</button>
        <button class="btn" onclick="sendCmd('resume')" id="btn-resume">▶ Resume</button>
        <button class="btn btn-danger" onclick="sendCmd('cancel')">✕ Cancel</button>
      </div>
    </div>

    <!-- Movement -->
    <div class="card">
      <div class="card-header">Movement</div>
      <div class="button-grid">
        <button class="btn" onclick="sendGcode('G28')">⌂ Home All</button>
        <button class="btn" onclick="sendGcode('M84')">⊘ Motors Off</button>
      </div>
    </div>

    <!-- Temperature Presets -->
    <div class="card">
      <div class="card-header">Hotend Presets</div>
      <div class="button-grid presets">
        <button class="btn btn-sm" onclick="setTemp('extruder', 200)">PLA 200°</button>
        <button class="btn btn-sm" onclick="setTemp('extruder', 230)">PETG 230°</button>
        <button class="btn btn-sm" onclick="setTemp('extruder', 245)">ABS 245°</button>
        <button class="btn btn-sm" onclick="setTemp('extruder', 220)">TPU 220°</button>
        <button class="btn btn-sm" onclick="setTemp('extruder', 0)">Cool ❄</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Bed Presets</div>
      <div class="button-grid presets">
        <button class="btn btn-sm" onclick="setTemp('heater_bed', 60)">PLA 60°</button>
        <button class="btn btn-sm" onclick="setTemp('heater_bed', 80)">PETG 80°</button>
        <button class="btn btn-sm" onclick="setTemp('heater_bed', 100)">ABS 100°</button>
        <button class="btn btn-sm" onclick="setTemp('heater_bed', 0)">Cool ❄</button>
      </div>
    </div>

    <!-- E-Stop -->
    <div class="card">
      <button class="btn btn-estop" onclick="emergencyStop()">🚨 EMERGENCY STOP</button>
    </div>

    <!-- GCode -->
    <div class="card">
      <div class="card-header">GCode Console</div>
      <div class="gcode-input-wrap">
        <input type="text" id="gcode-input" placeholder="Enter GCode command..." autocapitalize="characters">
        <button class="btn btn-send" onclick="sendGcodeInput()">→</button>
      </div>
      <div id="gcode-log" class="gcode-log"></div>
    </div>
  </main>

  <!-- ── Files Tab ───────────────────────────────────────────────────── -->
  <main id="tab-files" class="tab-content">
    <div class="card">
      <div class="card-header">
        <span>GCode Files</span>
        <button class="btn btn-sm" onclick="loadFiles()" style="margin-left:auto">↻ Refresh</button>
      </div>
      <div id="file-list" class="file-list">
        <div class="file-loading">Loading files...</div>
      </div>
    </div>
  </main>

  <!-- ── Camera Tab ──────────────────────────────────────────────────── -->
  <main id="tab-camera" class="tab-content">
    <div class="card">
      <div class="card-header">
        <span>Camera</span>
        <button class="btn btn-sm" onclick="takeSnapshot()">📷 Snapshot</button>
      </div>
      <div id="camera-container" class="camera-container">
        <div class="camera-placeholder">Tap Snapshot to capture</div>
      </div>
    </div>
  </main>

  <!-- ── Confirm Modal ───────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <p id="modal-text">Are you sure?</p>
      <div class="modal-buttons">
        <button class="btn" onclick="modalCancel()">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm" onclick="modalConfirm()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ───────────────────────────────────────────────────────── -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
